name: Release

# Publishes to npm using Trusted Publishing (OIDC). No NPM_TOKEN secret exists in
# this repository, and none should ever be added — the whole point is that there
# is no long-lived credential to steal. npm mints a short-lived token from the
# OIDC identity of this specific workflow in this specific repository.
#
# This also produces provenance attestations automatically, so consumers can
# verify the published tarball was built here from this commit.
#
# NOT YET ACTIVE. One manual step on npmjs.com is required first — see
# docs/RELEASING.md. Until that is done, this workflow will fail at the publish
# step (by design: it fails rather than falling back to something less safe).

on:
  # Publishing a GitHub Release is the single deliberate human action per release.
  # Everything after it — build, test, publish, provenance — is automatic.
  #
  # Deliberately NOT `push: branches: [main]` or `workflow_run` on green CI: those
  # would publish on every merge, which turns an irreversible action (an npm version
  # can be deprecated but never replaced) into a side effect of ordinary work.
  release:
    types: [published]

  # Kept for dry runs, so OIDC and packaging can be verified without publishing.
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run every step but do not actually publish'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # A GitHub environment gives you an optional required-reviewer gate on
    # publishing. Configure it in repo settings if you want a second pair of eyes.
    environment: npm-publish

    permissions:
      contents: read
      # Required for OIDC. Without it, npm cannot verify who is publishing.
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Node 24 is required, not merely preferred: Trusted Publishing needs
      # npm >= 11.5.1, and Node 18/20/22 bundle npm 10.x. The explicit npm
      # upgrade below is a belt-and-braces guard in case the bundled version
      # shifts.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          node -e "
            const { execFileSync } = require('node:child_process');
            const v = execFileSync('npm', ['--version'], { encoding: 'utf8', shell: true }).trim();
            const [maj, min, patch] = v.split('.').map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && patch >= 1)));
            if (!ok) {
              console.error('npm ' + v + ' is too old for trusted publishing; need >= 11.5.1');
              process.exit(1);
            }
            console.log('npm ' + v + ' supports trusted publishing.');
          "

      # The version published is ALWAYS the one in package.json — `npm publish` has
      # no way to override it. So rather than pass a version around, assert that the
      # release tag and package.json agree, and fail loudly if they do not. Silently
      # publishing a version different from the one the release announces would be
      # the worst outcome here.
      - name: Check the release tag matches package.json
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e "
            const pkg = require('./package.json');
            const tag = process.env.RELEASE_TAG ?? '';
            const tagVersion = tag.replace(/^v/, '');

            if (tagVersion === '') {
              console.error('Release has no tag_name; cannot verify the version.');
              process.exit(1);
            }
            if (tagVersion !== pkg.version) {
              console.error('Version mismatch — refusing to publish.');
              console.error('  release tag  : ' + tag + '  (-> ' + tagVersion + ')');
              console.error('  package.json : ' + pkg.version);
              console.error('Bump package.json and re-tag so the two agree.');
              process.exit(1);
            }
            console.log('Publishing ' + pkg.name + '@' + pkg.version + ' from tag ' + tag);
          "

      - name: Install
        run: npm ci --ignore-scripts

      - name: Verify before publishing
        run: |
          npm run typecheck
          npm run build
          npm test

      - name: Assert no runtime dependencies
        run: |
          node -e "
            const p = require('./package.json');
            const d = Object.keys(p.dependencies ?? {});
            if (d.length) { console.error('Runtime dependencies found:', d); process.exit(1); }
            console.log('OK: no runtime dependencies declared.');
          "

      - name: Show what would be published
        run: npm pack --dry-run

      # A published GitHub Release always publishes for real. A manual dispatch
      # publishes only when dry-run was explicitly unchecked, so the accident-prone
      # path defaults to safe.
      - name: Publish (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: npm publish --provenance --access public --dry-run

      - name: Publish
        if: ${{ github.event_name == 'release' || !inputs.dry-run }}
        # No NODE_AUTH_TOKEN / NPM_TOKEN. Authentication is the OIDC identity.
        run: npm publish --provenance --access public

      - name: Summary
        if: ${{ always() }}
        run: |
          node -e "
            const pkg = require('./package.json');
            const dispatched = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch';
            const dry = dispatched && process.env.DRY_RUN === 'true';
            console.log((dry ? 'DRY RUN — nothing published. ' : 'Published ') + pkg.name + '@' + pkg.version);
          " >> "$GITHUB_STEP_SUMMARY"
        env:
          DRY_RUN: ${{ inputs.dry-run }}
