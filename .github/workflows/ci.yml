name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  zero-deps:
    runs-on: ubuntu-latest
    name: Zero runtime dependencies
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assert no runtime dependencies
        run: |
          node -e "
            const p = require('./package.json');
            const d = Object.keys(p.dependencies ?? {});
            if (d.length) { console.error('Runtime dependencies found:', d); process.exit(1); }
            console.log('OK: no runtime dependencies declared.');
          "

      - name: Assert install tree is empty
        run: |
          npm install --omit=dev --ignore-scripts
          npm ls --omit=dev --all
