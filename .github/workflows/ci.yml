name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs, not floating tags. A tag
# like `v4` is a mutable pointer — whoever controls the action's repository can
# repoint it at new code, which then runs with this workflow's permissions. A SHA
# cannot be repointed. The trailing comment records which release the SHA is, so
# the pin stays readable and reviewable when bumping.
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22]
        # Shoot is developed on Windows and its path handling has bitten us twice
        # (the shim's file:// URL, and a bogus .gitignore match on CRLF). One
        # Windows leg on the supported floor catches that class before a release.
        include:
          - os: windows-latest
            node: 18
    name: Node ${{ matrix.node }} (${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  zero-deps:
    runs-on: ubuntu-latest
    name: Zero runtime dependencies
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Assert no runtime dependencies
        run: |
          node -e "
            const p = require('./package.json');
            const d = Object.keys(p.dependencies ?? {});
            if (d.length) { console.error('Runtime dependencies found:', d); process.exit(1); }
            console.log('OK: no runtime dependencies declared.');
          "

      - name: Assert install tree is empty
        run: |
          npm install --omit=dev --ignore-scripts
          npm ls --omit=dev --all
